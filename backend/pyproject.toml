[project]
name = "footlytics-backend"
version = "0.1.0"
description = "FOOTLYTICS post-match football analytics API foundation"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
