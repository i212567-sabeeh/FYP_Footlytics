<text x="184" y="214" font-size="20" font-weight="normal" fill="#22364a" text-anchor="start">React · TypeScript · Vite · Router · TanStack Query</text>
<text x="184" y="242" font-size="20" font-weight="normal" fill="#22364a" text-anchor="start">Domain pages · Calibration &amp; review · Analytics · Reports</text>
<path d="M 600 260 V 317" fill="none" stroke="#466178" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#back)"/>
