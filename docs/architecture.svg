<text x="184" y="772" font-size="20" font-weight="normal" fill="#22364a" text-anchor="start">Separate Linux / WSL Python process · CPU supported; CUDA optional</text>
<text x="184" y="800" font-size="20" font-weight="normal" fill="#22364a" text-anchor="start">YOLO · ByteTrack · jersey evidence · homography · trajectory cleaning</text>
<text x="184" y="828" font-size="20" font-weight="normal" fill="#22364a" text-anchor="start">Player &amp; team analytics · ReportLab PDF · CSV exports</text>
