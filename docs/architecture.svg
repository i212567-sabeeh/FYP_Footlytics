<text x="648" y="481" font-size="18" font-weight="normal" fill="#22364a" text-anchor="start">Job ID + attempt · JSON</text>
<rect x="60" y="512" width="480" height="116" rx="14" fill="#f0f3fb" stroke="#2e5266" stroke-width="2"/>
<text x="84" y="547" font-size="22" font-weight="bold" fill="#22364a" text-anchor="start">DATABASE LAYER</text>
<text x="84" y="578" font-size="20" font-weight="normal" fill="#22364a" text-anchor="start">SQLite: accounts, matches, job metadata</text>
<text x="84" y="606" font-size="20" font-weight="normal" fill="#22364a" text-anchor="start">PostgreSQL: intended, not live-verified</text>
<rect x="660" y="512" width="480" height="116" rx="14" fill="#fff6e8" stroke="#2e5266" stroke-width="2"/>
<text x="684" y="547" font-size="22" font-weight="bold" fill="#22364a" text-anchor="start">JOB QUEUE</text>
<text x="684" y="578" font-size="20" font-weight="normal" fill="#22364a" text-anchor="start">Redis + RQ · video-processing</text>
<text x="684" y="606" font-size="20" font-weight="normal" fill="#22364a" text-anchor="start">Durable status in DB · separate execution</text>
<path d="M 280 628 V 702" fill="none" stroke="#466178" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#back)"/>
<text x="302" y="667" font-size="18" font-weight="normal" fill="#22364a" text-anchor="start">Metadata / status</text>
