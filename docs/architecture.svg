<text x="184" y="990" font-size="20" font-weight="normal" fill="#22364a" text-anchor="start">Large files outside SQLite · protected access · no public storage mount</text>
<path d="M 1040 953 H 1172 V 390 H 1045" fill="none" stroke="#466178" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1160" y="860" transform="rotate(-90 1160 860)" font-size="18" fill="#22364a">API checks access + freshness before returning artifacts</text>
<text x="600" y="1051" font-size="18" font-weight="normal" fill="#22364a" text-anchor="middle">Runtime: WSL2 Ubuntu + Windows browser · settings, database and storage shared by API / worker</text></g></svg>
