<text x="184" y="355" font-size="22" font-weight="bold" fill="#22364a" text-anchor="start">API &amp; APPLICATION SERVICES</text>
<text x="184" y="386" font-size="20" font-weight="normal" fill="#22364a" text-anchor="start">FastAPI · Pydantic · Authentication / RBAC · Club scope</text>
<text x="184" y="414" font-size="20" font-weight="normal" fill="#22364a" text-anchor="start">Domain services · Input version guards · Protected results / downloads</text>
<text x="184" y="442" font-size="20" font-weight="normal" fill="#22364a" text-anchor="start">Job creation &amp; retry · short database transactions</text>
<path d="M 280 448 V 508" fill="none" stroke="#466178" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#back)"/>
<text x="65" y="482" font-size="18" font-weight="normal" fill="#22364a" text-anchor="start">SQLAlchemy + Alembic</text>
